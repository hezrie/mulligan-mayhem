# Agent Digest: weekly metrics issue (tickets done, first-pass success, needs-human rate, reverts,
# turns, cost, autonomy recommendation) and, if failures recurred, a PR proposing CLAUDE.md /
# LESSONS.md updates for the owner to merge. PROTECTED.
name: Agent Digest

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-digest
  cancel-in-progress: false

jobs:
  digest:
    if: vars.AGENT_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Record start time
        id: t
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Mint the bot App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Weekly metrics issue
        id: report
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          STARTED_AT: ${{ steps.t.outputs.started_at }}
        run: |
          npx tsx scripts/agent/cli.ts digest-report
          bash .claude/hooks/stamp-check.sh session

      - name: Resolve the bot identity
        if: steps.report.outputs.has_failures == 'true'
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Load config and prompt
        if: steps.report.outputs.has_failures == 'true'
        id: prep
        run: |
          npx tsx scripts/agent/cli.ts config --role digest
          npx tsx scripts/agent/cli.ts prompt --name digest

      - name: Run Claude (digest)
        if: steps.report.outputs.has_failures == 'true'
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          AGENT_MODE: digest
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: ${{ steps.app.outputs.app-slug }}
          bot_name: ${{ steps.bot.outputs.name }}
          bot_id: ${{ steps.bot.outputs.id }}
          settings: '{"env":{"AGENT_MODE":"digest"}}'
          prompt: ${{ steps.prep.outputs.text }}
          claude_args: |
            --model ${{ steps.prep.outputs.model }}
            --max-turns ${{ steps.prep.outputs.max_turns }}
            --allowedTools "Read,Glob,Grep,LS,Edit,Write"
            --disallowedTools "Bash,WebFetch,WebSearch,NotebookEdit"

      - name: Verify the guardrails were active
        if: always() && steps.report.outputs.has_failures == 'true'
        id: canary
        run: |
          if grep -q '^digest ' .agent/.state/hooks-active 2>/dev/null; then
            echo "loaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "loaded=false" >> "$GITHUB_OUTPUT"
            echo "::error::Guardrail hooks did not load for the digest; no PR will be opened."
            exit 1
          fi

      - name: Open the rulebook PR (if anything changed)
        if: steps.canary.outputs.loaded == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENT_BOT_TOKEN: ${{ steps.app.outputs.token }}
          DIGEST_ISSUE: ${{ steps.report.outputs.digest_issue }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
        run: npx tsx scripts/agent/cli.ts digest-pr --digest-issue "$DIGEST_ISSUE"
