# CI: the single source of truth for "does it work". Runs on every PR and every push to main.
# The `check` job runs the same steps as `npm run check`, in the same order (enforced by
# `npm run check:integrity`). PROTECTED.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the integrity check compares test counts against origin/main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # ---- Must match `npm run check` exactly (order included) ----
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run check:integrity
      - run: npm run build
      - run: npm run test:e2e
      # -------------------------------------------------------------

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "### Coverage (all of src)"
              jq -r '.total | "| | % |\n|---|---|\n| lines | \(.lines.pct) |\n| branches | \(.branches.pct) |\n| functions | \(.functions.pct) |"' coverage/coverage-summary.json
              echo
              echo "Core thresholds (src/core/**: 90% lines, 85% branches) are enforced by vitest."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
