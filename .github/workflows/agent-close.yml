# Agent Close: when a ticket closes, post a summary (PR link, deploy URL), strip status labels, log
# the run, and open an "Architecture & drift review" every N agent merges. No LLM. PROTECTED.
name: Agent Close

on:
  issues:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: agent-close-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # Deliberately ignores AGENT_PAUSED: no AI runs here, it only records a close a person made
  # (you merge every PR at level 1, pauses included). The trigger is not replayed after unpausing,
  # so skipping it would lose the ticket from the metrics for good.
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Mint the bot App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Summarize and clean up
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          ISSUE: ${{ github.event.issue.number }}
        run: npx tsx scripts/agent/cli.ts close --issue "$ISSUE"

  # MAX mode: a closed ticket usually means a merge just freed a slot, so start a worker run now
  # instead of waiting for the schedule.
  kick-worker:
    needs: close
    if: vars.AGENT_MAX_MODE == 'true' && vars.AGENT_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start a worker run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run agent-worker.yml --repo "$GITHUB_REPOSITORY" --ref main
