# Preflight: proves the loop's credentials and guardrails work, without touching any ticket.
#   app    (trusted)  the App key mints a token for the expected App, with write but not admin
#                     access; the run log exists; the Claude secret is present
#   claude (LLM, NO App token)  a one-line Claude run under AGENT_MODE=preflight; the hook canary
#                     must appear
# Run it by hand after changing secrets, the App, or the hooks. Ignores AGENT_PAUSED on purpose.
name: Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Mint the bot App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Check the App, its access, the run log and the Claude secret
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          EXPECTED_SLUG: ${{ vars.AGENT_APP_SLUG }}
          REPO: ${{ github.repository }}
          HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          fail=0
          check() { if [ "$2" = "ok" ]; then echo "✅ $1" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "❌ $1: $2" | tee -a "$GITHUB_STEP_SUMMARY"; fail=1; fi; }
          [ "$SLUG" = "$EXPECTED_SLUG" ] && check "App is $SLUG" ok || check "App slug" "got '$SLUG', vars.AGENT_APP_SLUG is '$EXPECTED_SLUG'"
          perms=$(gh api "repos/$REPO" --jq '.permissions | "push=\(.push) admin=\(.admin)"')
          [ "$perms" = "push=true admin=false" ] && check "App can write, is not admin ($perms)" ok || check "App access" "$perms (need push=true admin=false)"
          log=$(gh api "repos/$REPO/issues?state=open&labels=meta:run-log" --jq 'length')
          [ "$log" -ge 1 ] && check "Run log issue exists" ok || check "Run log" "missing (npm run setup:run-log)"
          [ "$HAS_CLAUDE_TOKEN" = "true" ] && check "CLAUDE_CODE_OAUTH_TOKEN is set" ok || check "Claude credential" "CLAUDE_CODE_OAUTH_TOKEN is empty"
          exit $fail

  claude:
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Load config
        id: prep
        run: |
          bash .claude/hooks/stamp-check.sh session
          npx tsx scripts/agent/cli.ts config --role refiner

      - name: Run Claude (preflight)
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          AGENT_MODE: preflight
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          settings: '{"env":{"AGENT_MODE":"preflight"}}'
          prompt: 'Preflight check. Reply with the single word OK and do nothing else.'
          claude_args: |
            --model ${{ steps.prep.outputs.model }}
            --max-turns ${{ steps.prep.outputs.max_turns }}
            --allowedTools "Read"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(gh:*),Bash,WebFetch,WebSearch"

      - name: Verify Claude ran with the guardrails loaded
        if: always()
        env:
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          fail=0
          if grep -q '^preflight ' .agent/.state/hooks-active 2>/dev/null; then echo "✅ Guardrail hooks loaded (canary present)" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "❌ Guardrail hooks did not load" | tee -a "$GITHUB_STEP_SUMMARY"; fail=1; fi
          if [ "$OUTCOME" = "success" ]; then echo "✅ Claude authenticated and answered" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "❌ Claude run failed ($OUTCOME): check CLAUDE_CODE_OAUTH_TOKEN" | tee -a "$GITHUB_STEP_SUMMARY"; fail=1; fi
          exit $fail
