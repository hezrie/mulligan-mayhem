# Preflight: proves the loop's credentials and guardrails work, without touching any ticket.
#   app    (trusted)  the App key mints a token for the expected App with exactly the access the
#                     loop needs (contents, issues and pull requests: write) and none it must not
#                     have (workflows, administration); the run log exists; the Claude secret is set
#   claude (LLM, NO App token)  a one-line Claude run under AGENT_MODE=preflight; the hook canary
#                     must appear
# Run it by hand after changing secrets, the App, or the hooks. Ignores AGENT_PAUSED on purpose.
name: Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Requesting explicit permissions makes GitHub refuse the token if the App lacks any of them,
      # which is the only reliable check (the repo API's `permissions` field ignores App grants).
      - name: Mint the bot App token (fails unless the App can write code, issues and PRs)
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: The App must not be able to change workflows (expected to fail)
        id: workflows
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-workflows: write

      - name: The App must not administer the repo (expected to fail)
        id: admin
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-administration: write

      - name: Check the App, its access, the run log and the Claude secret
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          EXPECTED_SLUG: ${{ vars.AGENT_APP_SLUG }}
          REPO: ${{ github.repository }}
          HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          WORKFLOWS_TOKEN: ${{ steps.workflows.outcome }}
          ADMIN_TOKEN: ${{ steps.admin.outcome }}
        run: |
          fail=0
          check() { if [ "$2" = "ok" ]; then echo "✅ $1" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "❌ $1: $2" | tee -a "$GITHUB_STEP_SUMMARY"; fail=1; fi; }
          if [ "$SLUG" = "$EXPECTED_SLUG" ]; then
            check "App is $SLUG" ok
          else
            check "App slug" "got '$SLUG', vars.AGENT_APP_SLUG is '$EXPECTED_SLUG'"
          fi
          check "App can write contents, issues and pull requests" ok # else the mint step failed
          if [ "$WORKFLOWS_TOKEN" = "failure" ]; then
            check "App cannot change workflows" ok
          else
            check "App permissions" "it has Workflows write; remove it in the App settings"
          fi
          if [ "$ADMIN_TOKEN" = "failure" ]; then
            check "App cannot administer the repo" ok
          else
            check "App permissions" "it has Administration write; remove it in the App settings"
          fi
          log=$(gh api "repos/$REPO/issues?state=open&labels=meta:run-log" --jq 'length')
          if [ "$log" -ge 1 ]; then
            check "Run log issue exists" ok
          else
            check "Run log" "missing (npm run setup:run-log)"
          fi
          if [ "$HAS_CLAUDE_TOKEN" = "true" ]; then
            check "CLAUDE_CODE_OAUTH_TOKEN is set" ok
          else
            check "Claude credential" "CLAUDE_CODE_OAUTH_TOKEN is empty"
          fi
          exit $fail

  claude:
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Load config
        id: prep
        run: |
          bash .claude/hooks/stamp-check.sh session
          npx tsx scripts/agent/cli.ts config --role refiner

      - name: Run Claude (preflight)
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          AGENT_MODE: preflight
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          settings: '{"env":{"AGENT_MODE":"preflight"}}'
          prompt: 'Preflight check. Reply with the single word OK and do nothing else.'
          claude_args: |
            --model ${{ steps.prep.outputs.model }}
            --max-turns ${{ steps.prep.outputs.max_turns }}
            --allowedTools "Read"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(gh:*),Bash,WebFetch,WebSearch"

      - name: Verify Claude ran with the guardrails loaded
        if: always()
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          fail=0
          if grep -q '^preflight ' .agent/.state/hooks-active 2>/dev/null; then echo "✅ Guardrail hooks loaded (canary present)" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "❌ Guardrail hooks did not load" | tee -a "$GITHUB_STEP_SUMMARY"; fail=1; fi
          if [ "$OUTCOME" = "success" ]; then
            echo "✅ Claude authenticated and answered" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # The prompt is fixed, so its only output is the answer or the error (e.g. an invalid or
            # expired token, usage limits). Show that one line; the action hides it by default.
            why="$(jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$EXECUTION_FILE" 2>/dev/null | head -c 300)"
            echo "❌ Claude run failed ($OUTCOME): ${why:-no message}. Check CLAUDE_CODE_OAUTH_TOKEN." | tee -a "$GITHUB_STEP_SUMMARY"
            fail=1
          fi
          exit $fail
