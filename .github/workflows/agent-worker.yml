# Agent Worker: three jobs on three fresh runners.
#   pick   (trusted, App token)   picks the ticket deterministically, labels it, writes its context
#   work   (LLM, NO App token)    Claude implements / plans / fixes under the guardrail hooks, then
#                                 packages its commits as a git bundle (data) for the next job
#   finish (trusted, App token)   on a clean checkout: applies the bundle as git objects only,
#                                 re-runs the protected-path guard, pushes, opens the PR, labels
# On GitHub-hosted runners every step of a job can read that job's secrets, so the job that runs
# LLM-written code never holds the App token. PROTECTED.
name: Agent Worker

on:
  schedule:
    - cron: '0 */2 * * *' # must equal workerCron in agent.config.json (enforced by check:integrity)
  workflow_dispatch:
    inputs:
      issue:
        description: Ticket number to work on (leave empty to let the picker choose)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: agent-worker
  cancel-in-progress: false

jobs:
  pick:
    if: vars.AGENT_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
      mode: ${{ steps.pick.outputs.mode }}
      pr: ${{ steps.pick.outputs.pr }}
      branch: ${{ steps.start.outputs.branch }}
      attempt: ${{ steps.start.outputs.attempt }}
      allow_golden: ${{ steps.start.outputs.allow_golden }}
      bot_name: ${{ steps.bot.outputs.name }}
      bot_email: ${{ steps.bot.outputs.email }}
      bot_id: ${{ steps.bot.outputs.id }}
      started_at: ${{ steps.t.outputs.started_at }}
    steps:
      - name: Record start time
        id: t
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Mint the bot App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Pick the next ticket (and recover orphans)
        id: pick
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          ISSUE: ${{ inputs.issue }}
        run: npx tsx scripts/agent/cli.ts pick --issue "${ISSUE:-0}"

      - name: Resolve the bot identity
        if: steps.pick.outputs.issue != ''
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)
          {
            echo "id=${id}"
            echo "name=${SLUG}[bot]"
            echo "email=${id}+${SLUG}[bot]@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"

      - name: Start (comment, labels, branch, ticket context)
        if: steps.pick.outputs.issue != ''
        id: start
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          ISSUE: ${{ steps.pick.outputs.issue }}
          MODE: ${{ steps.pick.outputs.mode }}
          PR: ${{ steps.pick.outputs.pr }}
        run: npx tsx scripts/agent/cli.ts worker-start --issue "$ISSUE" --mode "$MODE" --pr "${PR:-0}"

      - name: Hand the ticket context to the work job
        if: steps.pick.outputs.issue != ''
        uses: actions/upload-artifact@v7
        with:
          name: worker-context
          path: .agent/out/
          include-hidden-files: true
          retention-days: 3

  work:
    needs: pick
    # Re-checked here: the kill switch may have been pulled while pick ran. The finish job then
    # re-queues the ticket without counting anything.
    if: vars.AGENT_PAUSED != 'true' && needs.pick.outputs.issue != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Read-only on purpose, and no App token anywhere in this job.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      MODE: ${{ needs.pick.outputs.mode }}
      BRANCH: ${{ needs.pick.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Receive the ticket context
        uses: actions/download-artifact@v8
        with:
          name: worker-context
          path: .agent/out/

      - name: Prepare the branch
        id: prep
        env:
          GIT_AUTHOR_NAME: ${{ needs.pick.outputs.bot_name }}
          GIT_AUTHOR_EMAIL: ${{ needs.pick.outputs.bot_email }}
          GIT_COMMITTER_NAME: ${{ needs.pick.outputs.bot_name }}
          GIT_COMMITTER_EMAIL: ${{ needs.pick.outputs.bot_email }}
        run: |
          if [ "$MODE" = "fix" ]; then
            git fetch --no-tags origin "$BRANCH"
            git switch --track "origin/$BRANCH"
            # Bring main in first: the fix runs under main's current rules and tooling, and the
            # merge-base moves forward, so main's own changes never show up as this PR's changes.
            # If main changed workflow files, the bot App (no Workflows permission) couldn't push
            # that merge, and without it the branch would run outdated tooling: hand it to the owner.
            if ! git diff --quiet HEAD origin/main -- .github/workflows; then
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              echo "conflict_reason=workflows" >> "$GITHUB_OUTPUT"
            elif ! git merge --no-edit origin/main; then
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
            fi
            echo "base=origin/$BRANCH" >> "$GITHUB_OUTPUT"
          else
            git switch -c "$BRANCH" origin/main
            echo "base=origin/main" >> "$GITHUB_OUTPUT"
          fi
          # Runtime state never comes from the branch (a committed canary would fake "hooks loaded").
          rm -rf .agent/.state
          bash .claude/hooks/stamp-check.sh session

      - name: Restore Playwright browsers (read-only cache)
        if: env.MODE != 'plan'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: env.MODE != 'plan'
        run: npx playwright install --with-deps chromium

      - name: Load config and prompt
        id: load
        env:
          ISSUE: ${{ needs.pick.outputs.issue }}
          PR: ${{ needs.pick.outputs.pr }}
          ATTEMPT: ${{ needs.pick.outputs.attempt }}
        run: |
          case "$MODE" in plan) name=planner ;; fix) name=worker-fix ;; *) name=worker ;; esac
          npx tsx scripts/agent/cli.ts config --role worker
          npx tsx scripts/agent/cli.ts prompt --name "$name" --issue "$ISSUE" --pr "$PR" --attempt "$ATTEMPT"

      - name: Run Claude (worker)
        if: steps.prep.outputs.conflict != 'true'
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          AGENT_MODE: worker
          AGENT_ALLOW_GOLDEN: ${{ needs.pick.outputs.allow_golden }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: ${{ vars.AGENT_APP_SLUG }}
          bot_name: ${{ needs.pick.outputs.bot_name }}
          bot_id: ${{ needs.pick.outputs.bot_id }}
          settings: '{"env":{"AGENT_MODE":"worker","AGENT_ALLOW_GOLDEN":"${{ needs.pick.outputs.allow_golden }}"}}'
          prompt: ${{ steps.load.outputs.text }}
          claude_args: |
            --model ${{ steps.load.outputs.model }}
            --max-turns ${{ steps.load.outputs.max_turns }}
            --allowedTools "Read,Glob,Grep,LS,Edit,Write,MultiEdit,Bash(npm run:*),Bash(npm test),Bash(npx vitest:*),Bash(npx playwright test:*),Bash(npx tsx scripts/agent/escalate.ts:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*)"
            --disallowedTools "Bash(gh:*),Bash(git push:*),Bash(find:*),Bash(curl:*),Bash(wget:*),WebFetch,WebSearch"

      - name: Verify the guardrails were active
        if: always()
        id: canary
        run: |
          if grep -q '^worker ' .agent/.state/hooks-active 2>/dev/null; then
            echo "loaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "loaded=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Guardrail hooks did not load (no worker canary). The finish job will push nothing."
          fi

      - name: Package the result (git bundle + outputs, as data)
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          BASE: ${{ steps.prep.outputs.base }}
          HOOKS: ${{ steps.canary.outputs.loaded }}
          CONFLICT: ${{ steps.prep.outputs.conflict }}
          CONFLICT_REASON: ${{ steps.prep.outputs.conflict_reason }}
        run: >-
          npx tsx scripts/agent/cli.ts work-result --out-dir "$RUNNER_TEMP/result"
          --base "${BASE:-origin/main}" --hooks-loaded "${HOOKS:-false}" --conflict "${CONFLICT:-false}"
          --conflict-reason "${CONFLICT_REASON:-merge}"

      - name: Hand the result to the finish job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-result
          path: ${{ runner.temp }}/result/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload the agent transcript (debugging)
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: worker-transcript-${{ needs.pick.outputs.issue }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 7

  finish:
    needs: [pick, work]
    if: always() && needs.pick.outputs.issue != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Mint the bot App token (fresh, only now)
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Receive the work result (data only, outside the checkout)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: worker-result
          path: ${{ runner.temp }}/result/

      - name: Finish (guard, push, PR, labels, run log)
        id: finish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENT_BOT_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          STARTED_AT: ${{ needs.pick.outputs.started_at }}
          ISSUE: ${{ needs.pick.outputs.issue }}
          MODE: ${{ needs.pick.outputs.mode }}
          PR: ${{ needs.pick.outputs.pr }}
          BRANCH: ${{ needs.pick.outputs.branch }}
          ATTEMPT: ${{ needs.pick.outputs.attempt }}
          WORK_RESULT: ${{ needs.work.result }}
          PAUSED: ${{ vars.AGENT_PAUSED == 'true' }}
        run: >-
          npx tsx scripts/agent/cli.ts worker-finish --issue "$ISSUE" --mode "$MODE" --pr "${PR:-0}"
          --branch "$BRANCH" --attempt "${ATTEMPT:-1}" --result-dir "$RUNNER_TEMP/result" --work-result "$WORK_RESULT"
          --paused "$PAUSED"

      - name: Fail the run on infrastructure problems (so they are visible)
        if: steps.finish.outputs.outcome == 'infra-failure'
        run: |
          echo "::error::Infrastructure failure: see the comment on the ticket and the work job."
          exit 1
