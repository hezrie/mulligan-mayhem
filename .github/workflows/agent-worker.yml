# Agent Worker: picks the next ticket deterministically, lets Claude implement it (or plan it, or
# address review feedback) under the guardrail hooks, then performs all GitHub side effects itself.
# The LLM step only ever sees a read-only GITHUB_TOKEN; pushes and PRs use the bot App token in
# deterministic steps. PROTECTED.
name: Agent Worker

on:
  schedule:
    - cron: '0 */2 * * *' # must equal workerCron in agent.config.json (enforced by check:integrity)
  workflow_dispatch:
    inputs:
      issue:
        description: Ticket number to work on (leave empty to let the picker choose)
        required: false
        default: ''

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agent-worker
  cancel-in-progress: false

jobs:
  work:
    if: vars.AGENT_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Read-only on purpose: the LLM step inherits this token. Writes use the App token.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Record start time
        id: t
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Mint the bot App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Pick the next ticket
        id: pick
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ inputs.issue }}
        run: npx tsx scripts/agent/cli.ts pick --issue "${ISSUE:-0}"

      - name: Read agent config
        if: steps.pick.outputs.issue != ''
        id: cfg
        run: npx tsx scripts/agent/cli.ts config --role worker

      - name: Resolve the bot identity
        if: steps.pick.outputs.issue != ''
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Start (labels, comment, branch name)
        if: steps.pick.outputs.issue != ''
        id: start
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ steps.pick.outputs.issue }}
          MODE: ${{ steps.pick.outputs.mode }}
          PR: ${{ steps.pick.outputs.pr }}
        run: npx tsx scripts/agent/cli.ts worker-start --issue "$ISSUE" --mode "$MODE" --pr "${PR:-0}"

      - name: Prepare the branch
        if: steps.pick.outputs.issue != ''
        env:
          MODE: ${{ steps.pick.outputs.mode }}
          BRANCH: ${{ steps.start.outputs.branch }}
        run: |
          if [ "$MODE" = "fix" ]; then
            git fetch --no-tags origin "$BRANCH"
            git switch --track "origin/$BRANCH"
            # Run with main's rules, never the branch's (the action only does this for PR events).
            rm -rf .claude .agent/prompts .mcp.json .claude.json CLAUDE.local.md
            git checkout origin/main -- .claude CLAUDE.md .agent/prompts .agent/LESSONS.md
          else
            git switch -c "$BRANCH" origin/main
          fi
          bash .claude/hooks/stamp-check.sh session

      - name: Cache Playwright browsers
        if: steps.pick.outputs.issue != '' && steps.pick.outputs.mode != 'plan'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.pick.outputs.issue != '' && steps.pick.outputs.mode != 'plan'
        run: npx playwright install --with-deps chromium

      - name: Load the prompt
        if: steps.pick.outputs.issue != ''
        id: prompt
        env:
          MODE: ${{ steps.pick.outputs.mode }}
          ISSUE: ${{ steps.pick.outputs.issue }}
          PR: ${{ steps.pick.outputs.pr }}
          ATTEMPT: ${{ steps.start.outputs.attempt }}
        run: |
          case "$MODE" in plan) name=planner ;; fix) name=worker-fix ;; *) name=worker ;; esac
          npx tsx scripts/agent/cli.ts prompt --name "$name" --issue "$ISSUE" --pr "$PR" --attempt "$ATTEMPT"

      - name: Run Claude (worker)
        if: steps.pick.outputs.issue != ''
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          AGENT_MODE: worker
          AGENT_ALLOW_GOLDEN: ${{ steps.start.outputs.allow_golden }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: ${{ steps.app.outputs.app-slug }}
          bot_name: ${{ steps.bot.outputs.name }}
          bot_id: ${{ steps.bot.outputs.id }}
          settings: '{"env":{"AGENT_MODE":"worker","AGENT_ALLOW_GOLDEN":"${{ steps.start.outputs.allow_golden }}"}}'
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model ${{ steps.cfg.outputs.model }}
            --max-turns ${{ steps.cfg.outputs.max_turns }}
            --allowedTools "Read,Glob,Grep,LS,Edit,Write,MultiEdit,Bash(npm run:*),Bash(npm test),Bash(npx vitest:*),Bash(npx playwright test:*),Bash(npx tsx scripts/agent/escalate.ts:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(find:*)"
            --disallowedTools "Bash(gh:*),Bash(git push:*),Bash(curl:*),Bash(wget:*),WebFetch,WebSearch"

      - name: Verify the guardrails were active
        if: always() && steps.pick.outputs.issue != ''
        id: canary
        run: |
          if grep -q '^worker ' .agent/.state/hooks-active 2>/dev/null; then
            echo "loaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "loaded=false" >> "$GITHUB_OUTPUT"
            echo "::error::Guardrail hooks did not load (no worker canary). Nothing will be pushed."
          fi

      - name: Finish (push, PR, labels, run log)
        if: always() && steps.pick.outputs.issue != '' && steps.start.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENT_BOT_TOKEN: ${{ steps.app.outputs.token }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          STARTED_AT: ${{ steps.t.outputs.started_at }}
          HOOKS_LOADED: ${{ steps.canary.outputs.loaded }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
          ISSUE: ${{ steps.pick.outputs.issue }}
          MODE: ${{ steps.pick.outputs.mode }}
          PR: ${{ steps.pick.outputs.pr }}
          BRANCH: ${{ steps.start.outputs.branch }}
          ATTEMPT: ${{ steps.start.outputs.attempt }}
        run: >-
          npx tsx scripts/agent/cli.ts worker-finish --issue "$ISSUE" --mode "$MODE" --pr "${PR:-0}"
          --branch "$BRANCH" --attempt "$ATTEMPT"

      - name: Fail the run if the guardrails were missing
        if: always() && steps.canary.outputs.loaded == 'false'
        run: exit 1

      - name: Upload agent outputs
        if: always() && steps.pick.outputs.issue != ''
        uses: actions/upload-artifact@v7
        with:
          name: worker-${{ steps.pick.outputs.issue }}-${{ github.run_attempt }}
          path: |
            .agent/out/
            ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 7
